[project]
name = "deaths-warrant-pipeline"
version = "0.1.0"
description = "Offline pipeline that builds, exports and validates Death's Warrant prognosis models."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12,<3"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
